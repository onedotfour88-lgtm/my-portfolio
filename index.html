<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>나의 포트폴리오</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="container">


    <div class="card profile-header">

        <p class="profile-label">
            PORTFOLIO
        </p>

        <h1 id="profile-name">
            이름
        </h1>

        <p
            class="profile-basic"
            id="profile-basic"
        >
            나이 · 성별
        </p>

    </div>



    <div class="card">

        <h2>
            CONTACT
        </h2>


        <div
            id="email-section"
            class="contact-item"
        >

            <strong>
                EMAIL
            </strong>

            <span id="profile-email">
                비공개
            </span>

        </div>


        <div
            id="phone-section"
            class="contact-item"
        >

            <strong>
                PHONE
            </strong>

            <span id="profile-phone">
                비공개
            </span>

        </div>


        <div
            id="address-section"
            class="contact-item"
        >

            <strong>
                ADDRESS
            </strong>

            <span id="profile-address">
                비공개
            </span>

        </div>

    </div>



    <div class="card">

        <h2>
            경력
        </h2>

        <div id="profile-career">
            등록된 경력이 없습니다.
        </div>

    </div>



    <div class="card">

        <h2>
            강점
        </h2>

        <div id="profile-strength">
            등록된 내용이 없습니다.
        </div>

    </div>



    <div class="card">

        <h2>
            취향
        </h2>

        <div id="profile-taste">
            등록된 내용이 없습니다.
        </div>

    </div>



    <div class="card">

        <h2>
            각오
        </h2>

        <div id="profile-determination">
            등록된 내용이 없습니다.
        </div>

    </div>


</div>


<script>


// =====================================================
// 미리보기용 localStorage 데이터 불러오기
// =====================================================

const saved =
    localStorage.getItem("myPortfolio");


if (saved) {


    try {


        const profile =
            JSON.parse(saved);


        document.getElementById(
            "profile-name"
        ).textContent =

            profile.name || "이름";


        document.getElementById(
            "profile-basic"
        ).textContent =

            `${profile.age || "-"}세 · ${profile.gender || "-"}`;



        // 이메일

        if (
            profile.visibility &&
            profile.visibility.email &&
            profile.email
        ) {

            document.getElementById(
                "profile-email"
            ).textContent =

                profile.email;

        } else {

            document.getElementById(
                "profile-email"
            ).textContent =

                "비공개";

        }



        // 전화번호

        if (
            profile.visibility &&
            profile.visibility.phone &&
            profile.phone
        ) {

            document.getElementById(
                "profile-phone"
            ).textContent =

                profile.phone;

        } else {

            document.getElementById(
                "profile-phone"
            ).textContent =

                "비공개";

        }



        // 주소

        if (
            profile.visibility &&
            profile.visibility.address &&
            profile.address
        ) {

            document.getElementById(
                "profile-address"
            ).textContent =

                profile.address;

        } else {

            document.getElementById(
                "profile-address"
            ).textContent =

                "비공개";

        }



        // 경력

        document.getElementById(
            "profile-career"
        ).innerHTML =

            formatText(
                profile.career
            );



        // 강점

        document.getElementById(
            "profile-strength"
        ).innerHTML =

            formatText(
                profile.strength
            );



        // 취향

        document.getElementById(
            "profile-taste"
        ).innerHTML =

            formatText(
                profile.taste
            );



        // 각오

        document.getElementById(
            "profile-determination"
        ).innerHTML =

            formatText(
                profile.determination
            );


    } catch (error) {

        console.error(
            "프로필 데이터를 불러오지 못했습니다.",
            error
        );

    }

}



// =====================================================
// 줄바꿈 처리
// =====================================================

function formatText(value) {

    if (!value) {

        return "등록된 내용이 없습니다.";

    }


    return escapeHTML(value)
        .replace(/\n/g, "<br>");

}



// =====================================================
// HTML 보안 처리
// =====================================================

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


</script>


</body>

</html>
