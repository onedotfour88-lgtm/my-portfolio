<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>포트폴리오 편집</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

<main class="portfolio">

    <header class="profile-header">

        <h1>포트폴리오 편집</h1>

        <p>
            공개하고 싶은 정보를 선택하세요.
        </p>

    </header>


    <form method="POST">


        <section>

            <h2>기본 정보</h2>


            <!-- 이름 -->

            <label class="edit-item">

                <span>
                    이름
                </span>

                <strong>
                    {{ profile.name.value }}
                </strong>

                <input
                    type="checkbox"
                    name="name_public"
                    {% if profile.name.public %}
                        checked
                    {% endif %}
                >

                <span>
                    공개
                </span>

            </label>


            <!-- 나이 -->

            <label class="edit-item">

                <span>
                    나이
                </span>

                <strong>
                    {{ profile.age.value }}
                </strong>

                <input
                    type="checkbox"
                    name="age_public"
                    {% if profile.age.public %}
                        checked
                    {% endif %}
                >

                <span>
                    공개
                </span>

            </label>


            <!-- 성별 -->

            <label class="edit-item">

                <span>
                    성별
                </span>

                <strong>
                    {{ profile.gender.value }}
                </strong>

                <input
                    type="checkbox"
                    name="gender_public"
                    {% if profile.gender.public %}
                        checked
                    {% endif %}
                >

                <span>
                    공개
                </span>

            </label>

        </section>


        <section>

            <h2>개인정보</h2>


            <!-- 이메일 -->

            <label class="edit-item">

                <span>
                    이메일
                </span>

                <strong>
                    {{ profile.email.value }}
                </strong>

                <input
                    type="checkbox"
                    name="email_public"
                    {% if profile.email.public %}
                        checked
                    {% endif %}
                >

                <span>
                    공개
                </span>

            </label>


            <!-- 전화번호 -->

            <label class="edit-item">

                <span>
                    전화번호
                </span>

                <strong>
                    {{ profile.phone.value }}
                </strong>

                <input
                    type="checkbox"
                    name="phone_public"
                    {% if profile.phone.public %}
                        checked
                    {% endif %}
                >

                <span>
                    공개
                </span>

            </label>


            <!-- 주소 -->

            <label class="edit-item">

                <span>
                    주소
                </span>

                <strong>
                    {{ profile.address.value }}
                </strong>

                <input
                    type="checkbox"
                    name="address_public"
                    {% if profile.address.public %}
                        checked
                    {% endif %}
                >

                <span>
                    공개
                </span>

            </label>

        </section>


        <button
            type="submit"
            class="save-button"
        >
            저장하기
        </button>


    </form>


    {% if request.args.get("saved") %}

        <p class="saved-message">
            저장되었습니다!
        </p>

    {% endif %}


</main>

</body>

</html>
